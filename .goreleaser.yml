version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/powerctl
    binary: powerctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kristofferrisa/powerctl-cli/internal/commands.Version={{.Version}}
      - -X github.com/kristofferrisa/powerctl-cli/internal/commands.GitCommit={{.FullCommit}}
      - -X github.com/kristofferrisa/powerctl-cli/internal/commands.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# Publishes the Homebrew cask to github.com/KristofferRisa/homebrew-powerctl on
# every tagged release, so the tap is generated output and never hand-edited.
# Requires HOMEBREW_TAP_TOKEN (PAT with write access to the tap) in the release job.
homebrew_casks:
  - name: powerctl
    binaries: [powerctl]
    homepage: "https://github.com/KristofferRisa/powerctl-cli"
    description: "CLI tool for monitoring electricity consumption and tracking power costs via Tibber"
    commit_msg_template: "chore: powerctl {{ .Tag }}"
    # Never point the tap at a prerelease (e.g. the -rc tags draft_release.yml cuts).
    skip_upload: "auto"
    # The release binaries are unsigned, so macOS would quarantine them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/powerctl"]
          end
    repository:
      owner: KristofferRisa
      name: homebrew-powerctl
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com

release:
  github:
    owner: kristofferrisa
    name: powerctl-cli
  draft: false
  prerelease: auto
  # Re-running a tagged Release (or a retry after a partial publish) must replace
  # assets already on the GitHub release. Without this, GoReleaser 422s with
  # already_exists and never reaches the Homebrew tap push. That is what failed v0.4.0.
  replace_existing_artifacts: true
